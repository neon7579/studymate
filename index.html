<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>스터디 메이트</title>
<meta name="theme-color" content="#F5F6F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스터디메이트">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F4; --card:#FFFFFF; --ink:#18201C; --muted:#5B6660; --faint:#8A938E;
  --line:#E3E6E3; --field:#DCE0DD; --late:#C2410C; --late-ink:#A3360A; --late-soft:#FCEBE2;
  --me:#1F6F5C; --fr:#4A6FA5; --shadow:0 10px 30px rgba(24,32,28,.12);
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121614; --card:#1C221F; --ink:#E8ECE9; --muted:#9BA6A0; --faint:#6F7A74;
    --line:#2A322E; --field:#36403B; --late:#F07A45; --late-ink:#FF9C6E; --late-soft:#3A2218;
    --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
body{overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--card);border:1px solid var(--field);border-radius:10px;padding:0 12px;height:44px;width:100%}
textarea{height:auto;padding:10px 12px;resize:vertical;min-height:72px}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.hidden{display:none!important}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;padding:20px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.card{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-variant-numeric:tabular-nums}
.btn{white-space:nowrap;height:48px;border-radius:12px;border:0;background:var(--me);color:#fff;font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px dashed var(--field);color:var(--me);font-weight:600}
.btn.line{background:var(--card);border:1px solid var(--field);color:var(--ink);font-weight:600}
.btn.small{height:36px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--late-ink);border:1px solid var(--field)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--field);background:var(--card);font-size:13px}
.chip.on{border-color:var(--me);background:color-mix(in srgb,var(--me) 14%,var(--card));color:var(--ink);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:3px}
.seg button{height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late-ink)}
.pill.me{background:color-mix(in srgb,var(--me) 15%,var(--card));color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--me);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.err{color:var(--late-ink);font-size:13px}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:520px}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--me);font-weight:700}
nav.tabs svg{width:22px;height:22px}

/* 체크 항목 + 스와이프 */
.task{position:relative;overflow:hidden;border-radius:10px;margin:0 -8px}
.task .bgL,.task .bgR{visibility:hidden;position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;font-size:13px;font-weight:700;color:#fff}
.task.swiping .bgL,.task.swiping .bgR{visibility:visible}
.task .bgR{background:var(--me)}
.task .bgL{background:var(--late);justify-content:flex-end}
.task .fg{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:10px 8px;min-height:44px;touch-action:pan-y;transition:transform .25s}
.task.isLate .fg{background:var(--late-soft)}
.task .fg.drag{transition:none}
.chk{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--field);background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.chk.on{background:var(--me);border-color:var(--me)}
.chk svg{width:16px;height:16px;opacity:0}
.chk.on svg{opacity:1}
.task .t{flex:1;min-width:0}
.task.done .t{color:var(--faint);text-decoration:line-through}
.task .meta{font-size:11px;color:var(--muted)}
.task.isLate .meta{color:var(--late-ink);font-weight:600}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.stampWrap{position:relative}
.stamp{position:absolute;right:12px;top:8px;border:3px solid var(--me);color:var(--me);font-weight:800;font-size:15px;padding:2px 10px;border-radius:8px;transform:rotate(-12deg);opacity:.85;pointer-events:none}
.stamp.anim{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.85}}
.burst{position:fixed;pointer-events:none;font-weight:800;color:var(--me);z-index:60;animation:burst .9s forwards}
@keyframes burst{to{transform:translateY(-50px);opacity:0}}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--faint);text-align:center}
.cal button{height:52px;border-radius:10px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:13px}
.cal button.out{opacity:.3}
.cal button.today{font-weight:700}
.cal button.sel{border:2px solid var(--me);background:color-mix(in srgb,var(--me) 12%,var(--card))}
.cal button.late{border-color:var(--late);background:var(--late-soft)}
.cal .dots{display:flex;gap:3px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:3px}

/* 시트 */
.sheetBg{position:fixed;inset:0;background:rgba(10,14,12,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--field);align-self:center}

/* 대결 */
.arena{position:relative;height:190px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--me) 6%,var(--card)) 0%,var(--card) 70%)}
.arena .floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--line)}
.fighter{position:absolute;bottom:26px;width:92px;height:130px;transition:transform .2s}
.fighter.L{left:16%}
.fighter.R{right:16%}
.fighter .body{width:100%;height:100%;animation:idle 1.2s ease-in-out infinite}
.fighter.R .body{transform:scaleX(-1)}
@keyframes idle{50%{translate:0 -4px}}
.fighter.punch.L{transform:translateX(38px)}
.fighter.punch.R{transform:translateX(-38px)}
.fighter.punch .arm{transform:translateX(26px)}
.fighter .arm{transition:transform .12s}
.fighter.hit{animation:hit .35s}
.fighter.hit .face{filter:brightness(1.6)}
@keyframes hit{20%{transform:translateX(-8px) rotate(-6deg)}50%{transform:translateX(8px) rotate(4deg)}}
.fighter.ko .body{animation:none;transform:rotate(-80deg) translateY(30px)}
.fighter.R.ko .body{transform:scaleX(-1) rotate(-80deg) translateY(30px)}
.hp{position:absolute;top:10px;width:42%;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600}
.hp.L{left:10px}.hp.R{right:10px;text-align:right}
.hp .bar{height:10px}
.hp.R .bar>i{margin-left:auto;background:var(--fr)}
.dmg{position:absolute;font-weight:800;font-size:20px;color:var(--late);animation:burst .8s forwards;pointer-events:none}
.avatar{border-radius:50%;object-fit:cover;background:var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.vs .c{text-align:center;color:var(--muted);font-size:12px}
.vs .a{font-weight:700;text-align:right}.vs .b{font-weight:700}
.week{border-top:1px solid var(--line);padding-top:10px}
.week summary{list-style:none;cursor:pointer;flex-wrap:wrap;row-gap:2px}
.week summary::-webkit-details-marker{display:none}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--me)}.st.bad{color:var(--late-ink)}.st.rest{color:var(--faint)}
.bubble{padding:10px 12px;border-radius:14px;font-size:14px;max-width:80%;white-space:pre-wrap;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
.bubble.fr{background:var(--bg);border-bottom-left-radius:4px}
.bubble img{display:block;max-width:100%;border-radius:10px;margin-top:6px}

/* 떠다니는 사진 */
.prank{position:fixed;z-index:50;width:130px;height:130px;border-radius:16px;border:4px solid #fff;box-shadow:var(--shadow);padding:0;overflow:hidden;background:var(--line);touch-action:manipulation}
.prank img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.prank .crack{position:absolute;inset:0;pointer-events:none}
.prank .cnt{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;text-align:center;padding:3px}
.prank.shake{animation:hit .2s}
.prank.boom{animation:boom .5s forwards;pointer-events:none}
@keyframes boom{to{transform:scale(1.8) rotate(25deg);opacity:0;filter:blur(4px)}}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;animation:up .2s}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px max(20px,env(safe-area-inset-left,0px)) 32px max(20px,env(safe-area-inset-right,0px));max-width:420px;margin:0 auto}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0}
.swatch.on{border-color:var(--ink)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
